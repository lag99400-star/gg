
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twitch Counter</title>
<style>
body {
  background: transparent;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
.counter {
  color: black;
  font-size: 48px;
  font-weight: bold;
}
</style>
</head>
<body>

<div class="counter" id="twitch">Загрузка...</div>

<script>
async function updateTwitch() {
  try {
    const response = await fetch(
      "https://decapi.me/twitch/followcount/industrioussk_tw"
    );
    const count = (await response.text()).trim();

    document.getElementById("twitch").textContent =
      /^\d+$/.test(count) ? count : "Ошибка";
  } catch {
    document.getElementById("twitch").textContent = "Ошибка";
  }
}

updateTwitch();
setInterval(updateTwitch, 60000);
</script>

</body>
</html>
