
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Counter</title>
<style>
body {
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding-top: 50px;
}
.counter {
  font-size: 48px;
  font-weight: bold;
  margin: 15px;
}
</style>
</head>
<body>

<h2>YouTube</h2>
<div class="counter" id="youtube">Загрузка...</div>

<h2>Twitch</h2>
<div class="counter" id="twitch">Загрузка...</div>

<script>

async function updateYouTube() {
  try {
    const url = "https://pulse.walls.sh/profile?url=" +
      encodeURIComponent("https://www.youtube.com/@industrioussk65");

    const response = await fetch(url);
    if (!response.ok) throw new Error("HTTP " + response.status);

    const data = await response.json();
    if (typeof data.followers !== "number") {
      throw new Error("No subscriber data");
    }

    document.getElementById("youtube").textContent =
      String(data.followers);
  } catch (error) {
    document.getElementById("youtube").textContent = "Ошибка";
    console.error(error);
  }
}
  

  try {
    const response = await fetch(
      "https://decapi.me/twitch/followcount/industrioussk_tw"
    );
    const count = await response.text();

    document.getElementById("twitch").textContent =
      /^\d+$/.test(count.trim()) ? count.trim() : "Ошибка";
  } catch {
    document.getElementById("twitch").textContent = "Ошибка";
  }
}

update();
setInterval(update, 60000);
</script>

</body>
</html>
